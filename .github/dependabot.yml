version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    # Set the directory to "/" to check for workflow files in .github/workflows
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "05:00"
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  # Maintain dependencies for maven
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "*bonitasoft*"
      # Skip maven-jar-plugin 3.5.0+ due to Guice incompatibility (BPA-427)
      - dependency-name: "*maven-jar-plugin*"
        versions: ["[3.5.0,)"]
    groups:
      maven-plugins:
        patterns:
          - "*maven.plugins*"
      test:
        patterns:
          - "*assertj*"
          - "*junit*"
          - "*test*"
          - "*mockito*"
      jaxb:
        patterns:
          - "*jaxb*"
